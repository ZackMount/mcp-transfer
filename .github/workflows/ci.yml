name: Platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ubuntu-2204-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Jammy dependency setup with an existing Ubuntu Docker installation
        run: |
          docker run --rm -v "$PWD:/workspace:ro" -v /var/run/docker.sock:/var/run/docker.sock ubuntu:22.04 bash -c '
            set -euo pipefail
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates docker.io
            before_version="$(docker --version)"
            . /workspace/scripts/ensure-docker.sh
            ensure_docker
            test "$(docker --version)" = "$before_version"
          '
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c requirements.lock ".[dev]"
      - run: ruff check src tests
      - run: node --test tests/test_webui.js
      - run: pytest -q
      - name: Windows real frp and MCP subprocess integration
        if: runner.os == 'Windows'
        env:
          MCPT_E2E: '1'
        run: python -m pytest tests/test_e2e.py -q
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem scripts/*.ps1) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { $parseErrors | Format-List; exit 1 }
          }
      - name: Anonymous Windows source download
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap-windows.ps1 -Role client -PrepareOnly
      - run: python -m build
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock ".[dev]"
      - run: MCPT_E2E=1 pytest tests/test_e2e.py -q
      - run: docker compose --env-file deploy/ci.env config --quiet
      - name: Validate HTTP-only ingress on custom port
        run: |
          docker run --rm -e MCPT_PUBLIC_URL=http://203.0.113.10:18080 -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy adapt --config /etc/caddy/Caddyfile > /tmp/mcpt-caddy.json
          python - <<'PY'
          import json
          config = json.load(open('/tmp/mcpt-caddy.json'))
          servers = config['apps']['http']['servers'].values()
          assert {port for server in servers for port in server['listen']} == {':18080'}
          assert not any(server.get('tls_connection_policies') for server in servers)
          PY
      - run: COMPOSE_BAKE=false docker compose --env-file deploy/ci.env build cloud
      - name: Anonymous Linux source download
        run: bash scripts/bootstrap-cloud.sh --prepare-only --install-dir "$RUNNER_TEMP/mcp-transfer-download"
  native-deployment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native cloud on the physical runner
        run: |
          sudo mkdir /opt/mcp-transfer-native
          sudo cp -a . /opt/mcp-transfer-native/
          sudo bash /opt/mcp-transfer-native/scripts/install-cloud-native.sh --public-url http://127.0.0.1:18080 --frp-port 17000 --allow-insecure-http
          curl --fail http://127.0.0.1:18080/healthz
          sudo systemctl is-active mcp-transfer-cloud
      - name: Upgrade preserves the database and cloud identity
        run: |
          before="$(sudo sha256sum /opt/mcp-transfer-native/data/cloud/pki/ca.key /opt/mcp-transfer-native/data/cloud/signing.key)"
          sudo bash /opt/mcp-transfer-native/scripts/install-cloud-native.sh
          test "$before" = "$(sudo sha256sum /opt/mcp-transfer-native/data/cloud/pki/ca.key /opt/mcp-transfer-native/data/cloud/signing.key)"
          curl --fail http://127.0.0.1:18080/healthz
      - name: Full cleanup removes only this deployment
        run: |
          sudo bash /opt/mcp-transfer-native/scripts/uninstall-cloud.sh --install-dir /opt/mcp-transfer-native --purge --yes --keep-source
          test ! -d /opt/mcp-transfer-native/data
          test ! -d /opt/mcp-transfer-native/runtime
          test ! -f /etc/systemd/system/mcp-transfer-cloud.service
          test -f /opt/mcp-transfer-native/pyproject.toml
      - name: Failure diagnostics
        if: failure()
        run: sudo journalctl -u mcp-transfer-cloud -n 100 --no-pager
