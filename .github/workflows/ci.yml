name: Platform checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -c requirements.lock ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem scripts/*.ps1) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { $parseErrors | Format-List; exit 1 }
          }
      - run: python -m build
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock ".[dev]"
      - run: MCPT_E2E=1 pytest tests/test_e2e.py -q
      - run: docker compose --env-file deploy/ci.env config --quiet
      - run: docker build -t mcp-transfer:test .
